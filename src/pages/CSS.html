<style>
:root {
  --ink: #2A2024; --ink-2: #5B4F54; --muted: #8A7E83;
  --paper: #FBF8F6; --card: #FFFFFF; --line: #EDE3E0; --line-2: #DCCDC8;
  --blood: #B3243F; --blood-dark: #8A1A30; --blood-deep: #5E1121; --blood-tint: #FCEFF1; --blood-wash: #FFF8F9;
  --ring: rgba(179, 36, 63, .22);
  --ok: #166534; --ok-bg: #DCFCE7; --warn: #92400E; --warn-bg: #FEF3C7; --bad: #B91C1C; --bad-bg: #FEE2E2; --neutral: #57534E; --neutral-bg: #ECE7E4;
  --shadow: 0 1px 2px rgba(60, 20, 30, .05), 0 12px 28px -16px rgba(60, 20, 30, .22);
  --font: 'Sarabun', system-ui, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
@media (min-width: 1280px) { html { font-size: 17.5px; } }
@media (min-width: 1680px) { html { font-size: 19px; } }
@media (min-width: 2200px) { html { font-size: 22px; } }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 400 .95rem/1.65 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font-family: var(--font); }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.wrap { width: 100%; max-width: 2600px; margin: 0 auto; padding: 0 clamp(14px, 3.2vw, 72px); }
.main { flex: 1; padding-top: 24px; padding-bottom: 48px; }
.center { text-align: center; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 30; background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--blood); display: grid; place-items: center; box-shadow: 0 0 0 4px var(--blood-tint); }
.brand-text h1 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.3; letter-spacing: -.005em; }
.brand-text p { margin: 0; font-size: .8rem; color: var(--muted); }
.header-actions, .user-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.user-bar { padding-right: 8px; margin-right: 4px; border-right: 1px solid var(--line); }
.user-name { font-weight: 600; font-size: .9rem; }

/* ---------- Hero ---------- */
.hero { color: #fff; padding: 2rem 0 4.4rem;
  background: radial-gradient(circle at 92% 18%, rgba(255,255,255,.09) 0 110px, transparent 111px),
              radial-gradient(circle at 78% 105%, rgba(255,255,255,.07) 0 80px, transparent 81px), var(--blood-deep); }
.hero .eyebrow { margin: 0 0 4px; font-size: .8rem; font-weight: 500; letter-spacing: .04em; color: #F4C3CD; }
.hero h2 { margin: 0; font-size: 1.7rem; line-height: 1.3; font-weight: 700; }
.hero .lead { margin: 6px 0 0; color: #F0D5DA; font-size: .95rem; }
.steps { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 18px 0 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px; border-radius: 999px; background: rgba(255, 255, 255, .11); font-size: .88rem; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: #fff; color: var(--blood-dark); font-weight: 700; font-size: .8rem; }
.hero + .main { margin-top: -38px; padding-top: 0; }

/* ---------- Cards & layout ---------- */
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px; min-width: 0; box-shadow: var(--shadow); }
.card.narrow { max-width: 440px; margin: 0 auto 24px; border-top: 4px solid var(--blood); }
.card h2 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.005em; }
.hint { margin: 4px 0 20px; color: var(--muted); font-size: .88rem; }
.layout { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
@media (min-width: 1100px) {
  .layout { grid-template-columns: clamp(400px, 30%, 680px) 1fr; }
  .form-panel { position: sticky; top: 84px; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 14px; }
  .card { padding: 18px; border-radius: 16px; }
  .hero { padding: 22px 0 60px; } .hero h2 { font-size: 1.4rem; }
  .brand-text p { display: none; }
}

/* ---------- Forms ---------- */
.field { margin-bottom: 16px; }
.field label, .lbl { display: block; margin-bottom: 6px; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
input[type=text], input[type=password], input[type=date], input[type=month], select {
  width: 100%; min-height: 2.75rem; padding: 9px 13px; font-size: .95rem; color: var(--ink); background: #fff;
  border: 1.5px solid var(--line-2); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
input:hover, select:hover { border-color: #C9B6B0; }
input:focus, select:focus { border-color: var(--blood); box-shadow: 0 0 0 4px var(--ring); }
input:disabled { background: #F6F1EF; color: var(--muted); }
input[type=checkbox] { width: 1.15rem; height: 1.15rem; accent-color: var(--blood); }
.error { min-height: 1.4em; margin: 0 0 10px; color: var(--bad); font-size: .88rem; }
.row { display: flex; gap: 10px; justify-content: flex-end; }

/* ---------- Buttons ---------- */
.btn-primary, .btn-add { display: flex; align-items: center; justify-content: center; gap: .55rem; width: 100%; height: 3rem; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .15s, transform .1s, border-color .15s; }
.btn-primary { border: 0; color: #fff; background: var(--blood); box-shadow: 0 6px 14px -6px rgba(179, 36, 63, .6); }
.btn-primary:hover:not(:disabled) { background: var(--blood-dark); }
.btn-primary:active:not(:disabled) { transform: translateY(1px); }
.btn-primary:disabled { opacity: .6; cursor: wait; box-shadow: none; }
.btn-add { border: 1.5px dashed #E3B1BB; background: var(--blood-wash); color: var(--blood-dark); }
.btn-add:hover { background: var(--blood-tint); border-color: var(--blood); }
.btn-ghost { display: inline-flex; align-items: center; gap: .45rem; min-height: 2.25rem; padding: 6px 14px; border: 1.5px solid var(--line-2); border-radius: 10px; background: #fff; color: var(--ink); font-size: .86rem; font-weight: 500; cursor: pointer; text-decoration: none; transition: all .15s; }
.btn-ghost:hover { border-color: var(--blood); color: var(--blood-dark); background: var(--blood-wash); }
.btn-link { border: 0; background: none; padding: 0; color: var(--muted); font-size: .82rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.btn-link.danger { color: var(--bad); }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.row .btn-primary { width: auto; padding: 0 24px; }

/* ---------- Leave entries ---------- */
#entries { max-height: 62vh; overflow-y: auto; padding: 2px 2px 0 0; }
.entry { background: var(--blood-wash); border: 1px solid #F3DDE1; box-shadow: inset 4px 0 0 var(--blood); border-radius: 14px; padding: 16px 16px 16px 20px; margin-bottom: 12px; }
.entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.entry-head h3 { margin: 0; font-size: .95rem; font-weight: 700; color: var(--blood-dark); }
.entry .field { margin-bottom: 10px; }
.check { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; font-size: .88rem; cursor: pointer; }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
@media (max-width: 420px) { .dates { grid-template-columns: 1fr; } }
.sum { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid #EBD9DD; font-size: .88rem; }
.sum:empty { display: none; }
.sum strong { color: var(--blood-dark); }
.sum.bad { color: var(--bad); border-color: #FCA5A5; background: var(--bad-bg); }
.sum .sub { color: var(--muted); font-size: .82rem; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
table { width: 100%; min-width: 640px; border-collapse: collapse; }
th { background: var(--blood-wash); color: var(--ink-2); font-size: .8rem; font-weight: 600; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 13px 16px; font-size: .9rem; border-bottom: 1px solid #F5EEEC; vertical-align: top; }
tbody tr:hover { background: #FFFBFB; }
tr:last-child td { border-bottom: 0; }
th.c, td.c { text-align: center; }
td.empty { padding: 44px 16px; text-align: center; color: var(--muted); }
td .sub, .note { color: var(--muted); font-size: .82rem; }
.strong { font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px 3px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-Pending { background: var(--warn-bg); color: var(--warn); }
.st-Approve { background: var(--ok-bg); color: var(--ok); }
.st-Reject { background: var(--bad-bg); color: var(--bad); }
.st-Cancelled { background: var(--neutral-bg); color: var(--neutral); }

/* ตารางบนมือถือ: แสดงเป็นการ์ดต่อรายการ */
@media (max-width: 700px) {
  .table-wrap { border: 0; background: none; overflow: visible; }
  table, tbody, tr, td { display: block; width: 100%; min-width: 0; }
  thead { position: absolute; left: -9999px; }
  tbody tr { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px; margin-bottom: 10px; }
  td { display: flex; justify-content: space-between; gap: 16px; border: 0; padding: 8px 0; text-align: right; }
  td.c { text-align: right; }
  td::before { flex: none; color: var(--muted); font-size: .8rem; text-align: left; }
  td.empty { display: block; text-align: center; padding: 32px 0; }
  td.empty::before { content: none !important; }
  #historyBody td:nth-child(1)::before { content: 'วันที่ลา'; }
  #historyBody td:nth-child(2)::before { content: 'ประเภท'; }
  #historyBody td:nth-child(3)::before { content: 'จำนวนวัน'; }
  #historyBody td:nth-child(4)::before { content: 'สถานะ'; }
  #historyBody td:nth-child(5)::before { content: 'รายละเอียด'; }
  #allBody td:nth-child(1)::before { content: 'ชื่อ-นามสกุล'; }
  #allBody td:nth-child(2)::before { content: 'ประเภท'; }
  #allBody td:nth-child(3)::before { content: 'วันที่ลา'; }
  #allBody td:nth-child(4)::before { content: 'จำนวนวัน'; }
  #allBody td:nth-child(5)::before { content: 'สถานะ'; }
  #allBody td:nth-child(6)::before { content: 'ส่งเมื่อ'; }
}

/* ตารางที่ไม่ต้องเปลี่ยนเป็นการ์ดบนมือถือ (class keep) */
@media (max-width: 700px) {
  .table-wrap.keep { overflow-x: auto; border: 1px solid var(--line); background: #fff; }
  .keep table { display: table; width: 100%; min-width: 640px; }
  .keep thead { position: static; display: table-header-group; }
  .keep tbody { display: table-row-group; }
  .keep tbody tr { display: table-row; background: none; border: 0; padding: 0; margin: 0; }
  .keep td { display: table-cell; padding: 13px 16px; text-align: left; border-bottom: 1px solid #F5EEEC; }
  .keep td.c { text-align: center; }
  .keep td::before { content: none !important; }
}

/* ---------- Summary tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.tile { padding: 14px 18px; border: 1px solid #F3DDE1; border-radius: 14px; background: var(--blood-wash); }
.tile.warn { background: var(--warn-bg); border-color: #FCD34D; }
.tile.main { background: var(--blood); border-color: var(--blood); color: #fff; }
.tile.main .tile-label, .tile.main .tile-sub, .tile.main .tile-value small { color: #F9D3DA; }
.tile.main .tile-value { color: #fff; }
.tile-label { color: var(--ink-2); font-size: .85rem; font-weight: 500; }
.tile-value { font-size: 2rem; font-weight: 700; line-height: 1.25; color: var(--blood-dark); }
.tile-value small { font-size: .8rem; font-weight: 500; color: var(--muted); }
.tile-sub { color: var(--muted); font-size: .8rem; }
.summary { margin-bottom: 20px; }
.period-select { width: auto; min-width: 230px; }
.alt { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line-2); font-size: .88rem; color: var(--muted); }

/* ---------- Tabs / Pager / ตารางรวม (ใช้ร่วมกันทั้งสองหน้า) ---------- */
.tabs { display: inline-flex; gap: 4px; padding: 4px; margin: 0 0 16px; background: #F2E9E6; border-radius: 14px; max-width: 100%; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: .5rem; padding: 9px 18px; border: 0; border-radius: 10px; background: none; font-size: .92rem; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
.tab:hover { color: var(--blood-dark); }
.tab[aria-selected=true] { background: #fff; color: var(--blood-dark); box-shadow: 0 1px 3px rgba(60, 20, 30, .15); }
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 2px; border-radius: 999px; background: var(--blood); color: #fff; font-size: .75rem; line-height: 20px; text-align: center; }
.count:empty { display: none; }
.tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
.tbar .search { position: relative; flex: 1; min-width: 200px; }
.tbar .search input { padding-left: 2.5rem; }
.tbar select { width: auto; }
tr.mine td { background: var(--blood-wash); }
.me-tag { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px; background: var(--blood); color: #fff; font-size: .72rem; font-weight: 600; vertical-align: middle; }
.pager { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding-top: 14px; }
.pager button { min-width: 2.3rem; height: 2.3rem; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 9px; background: #fff; color: var(--ink-2); font-weight: 600; cursor: pointer; }
.pager button:hover:not(:disabled):not(.active) { background: var(--blood-wash); border-color: var(--blood); color: var(--blood-dark); }
.pager button.active { background: var(--blood); border-color: var(--blood); color: #fff; }
.pager button:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- Footer ---------- */
.site-footer { background: var(--blood-deep); padding: 18px 20px; text-align: center; }
.site-footer p { margin: 0; color: #D9B4BC; font-size: .85rem; }
.footer-author { color: #fff; font-weight: 500; }

/* ---------- SweetAlert2 ---------- */
.swal2-popup { font-family: var(--font) !important; border-radius: 18px !important; }
.swal2-title { font-size: 1.2rem !important; font-weight: 700 !important; color: var(--ink) !important; }
.swal2-html-container, .swal2-input { font-family: var(--font) !important; }
.swal2-styled { border-radius: 10px !important; font-weight: 600 !important; box-shadow: none !important; }
.swal2-confirm { background-color: var(--blood) !important; }
.swal2-styled:focus { box-shadow: 0 0 0 4px var(--ring) !important; }

/* ---------- ไอคอน (sprite จาก Icons.html) ---------- */
.ic { flex: none; width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
.btn-primary .ic, .btn-add .ic { width: 1.25em; height: 1.25em; }
.tab .ic { width: 1.1em; height: 1.1em; }
.badge .ic { width: 1.05em; height: 1.05em; }
.badge.bi::before { content: none; }
.bt { min-width: 0; }
.busy .ic { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ปุ่มไอคอนอย่างเดียว (ต้องมี title และ aria-label เสมอ) */
.btn-ghost.btn-icon { justify-content: center; width: 2.25rem; height: 2.25rem; min-height: 0; padding: 0; }
.btn-icon .ic { width: 1.2em; height: 1.2em; }
.btn-ghost.danger { color: var(--bad); }
.btn-ghost.danger:hover { color: var(--bad); border-color: #F3B4B4; background: var(--bad-bg); }
.search > .ic { position: absolute; left: 14px; top: 50%; margin-top: -.575em; color: var(--muted); pointer-events: none; }

/* หัวข้อการ์ดที่มีไอคอนนำหน้า */
.h-ic { display: flex; align-items: center; gap: .65rem; }
.h-ic > .ic { box-sizing: content-box; width: 1.1rem; height: 1.1rem; padding: .42rem; border-radius: 10px; background: var(--blood-tint); color: var(--blood); }
.user-name { display: inline-flex; align-items: center; gap: .4rem; }
.user-name .ic { color: var(--blood); }
.hint-list b .ic { color: var(--blood); }

/* ปุ่มเล็กในตาราง เช่น "ยกเลิกใบลานี้" */
.btn-chip { display: inline-flex; align-items: center; gap: .35rem; margin-top: 6px; padding: 3px 11px 3px 9px; border: 1px solid #F3C4C4; border-radius: 999px; background: #fff; color: var(--bad); font-size: .78rem; font-weight: 600; cursor: pointer; transition: background .15s; }
.btn-chip:hover { background: var(--bad-bg); }
.btn-chip .ic { width: 1.05em; height: 1.05em; }

/* ปุ่มหน้าเลขหน้า */
.pager button { display: inline-flex; align-items: center; justify-content: center; }

@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- ข้อความแนะนำใต้หัวข้อ Login ---------- */
#screenLogin > .hint { margin-bottom: 10px; }
.hint-list { list-style: none; margin: 0 0 20px; padding: 10px 14px; display: grid; gap: 6px; background: var(--blood-wash); border: 1px solid #F3DDE1; border-radius: 12px; font-size: .86rem; color: var(--ink-2); }
.hint-list li { display: flex; gap: 10px; align-items: baseline; }
.hint-list b { flex: none; display: inline-flex; align-items: center; gap: .4rem; min-width: 8.2em; color: var(--blood-dark); font-weight: 600; }

/* ---------- ตัวเลือกวันที่ (พ.ศ.) ---------- */
.dp { position: relative; }
.dp-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 2.75rem; padding: 9px 13px; font-size: .95rem; text-align: left; color: var(--ink); background: #fff; border: 1.5px solid var(--line-2); border-radius: 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.dp-btn:hover:not(:disabled) { border-color: #C9B6B0; }
.dp-btn:focus-visible { border-color: var(--blood); box-shadow: 0 0 0 4px var(--ring); outline: none; }
.dp-btn:disabled { background: #F6F1EF; color: var(--muted); cursor: not-allowed; }
.dp-btn .ic { flex: none; color: var(--blood); }
.dp-txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-txt.ph { color: var(--muted); }
.dp-back { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 14px; background: rgba(42, 20, 28, .45); }
.dp-pop { width: min(340px, 100%); padding: 14px; border-radius: 18px; background: #fff; box-shadow: 0 24px 60px -18px rgba(42, 20, 28, .6); }
.dp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.dp-head b { font-size: 1rem; font-weight: 700; color: var(--blood-dark); }
.dp-nav { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border: 1.5px solid var(--line-2); border-radius: 10px; background: #fff; color: var(--ink-2); cursor: pointer; }
.dp-nav:hover:not(:disabled) { border-color: var(--blood); color: var(--blood-dark); background: var(--blood-wash); }
.dp-nav:disabled { opacity: .35; cursor: not-allowed; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.dp-dow { padding: 4px 0; text-align: center; font-size: .78rem; font-weight: 600; color: var(--muted); }
.dp-dow.we, .dp-day.we { color: #B3243F; }
.dp-day { height: 2.5rem; border: 0; border-radius: 10px; background: none; font-size: .92rem; font-weight: 500; color: var(--ink); cursor: pointer; }
.dp-day:hover:not(:disabled):not(.sel) { background: var(--blood-tint); }
.dp-day.today { box-shadow: inset 0 0 0 1.5px var(--blood); }
.dp-day.sel { background: var(--blood); color: #fff; font-weight: 700; }
.dp-day:disabled { color: #CFC4C0; cursor: not-allowed; }
.dp-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }

/* ---------- ปฏิทินการลา (พนักงาน) ---------- */
.cal-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-bar h3 { flex: 1; min-width: 9rem; margin: 0; text-align: center; font-size: 1.05rem; font-weight: 700; color: var(--blood-dark); }
